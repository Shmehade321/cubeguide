name: CubeGuide verification
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
# Jobs only read the repository; artifact upload uses the runtime token.
permissions:
  contents: read
# A newer push supersedes an older run of the same PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Package, storage, solver and table qualification need no app project or simulator,
    # so they run on the newest Xcode the hosted image provides.
    name: Package, solver and tables
    runs-on: macos-15
    timeout-minutes: 75
    env:
      ARTIFACT_DIR: Artifacts/ci-package
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-tables.sh checks the generator source against the commit recorded in the
          # table manifest, which a shallow checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Select the newest installed Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Install pinned test-only oracle dependency
        run: python3 -m pip install -r Tools/TableValidator/requirements.txt
      - name: Tooling tests
        run: |
          python3 -m unittest discover -s Tests/Infrastructure -v
          python3 -m unittest discover -s Tools/TableValidator -v
          python3 -m unittest discover -s Tools/Corpus -v
          python3 -m unittest discover -s Tools/ReferenceSolver -v
      - name: Package tests
        run: Scripts/test-package.sh
      - name: Storage crash qualification
        run: Scripts/test-storage-crashes.sh
      - name: PR solver corpus with independent replay and pinned reference
        run: Scripts/test-solver.sh
      - name: Independently reproduce and validate every solver table
        run: Scripts/verify-tables.sh
      - name: Retain results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-evidence
          path: Artifacts/
          if-no-files-found: error
  app:
    name: App and UI tests (iOS 18.5 simulator)
    # Set the repository variable CUBEGUIDE_APP_RUNNER to a runner label that provides Xcode 27
    # and the iOS 18.5 runtime. Until then this job fails, naming what is missing.
    runs-on: ${{ vars.CUBEGUIDE_APP_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    env:
      CUBEGUIDE_APP_STAGE_ONLY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 27 or later
        # cubeguide.xcodeproj uses the Xcode 27 project format (objectVersion 110). Fail with the
        # reason instead of letting an older xcodebuild fail late or substituting a toolchain.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          major=$(basename "$xcode" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')
          if [ "${major:-0}" -lt 27 ]; then
            installed=$(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')
            echo "::error title=Xcode 27 required::The app project needs Xcode 27 or later; this runner has: $installed. Use a runner image or self-hosted runner that provides it."
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Record available simulators
        run: xcrun simctl list devices available
      - name: Resolve required minimum-family runtime
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          candidates=[d for r,ds in devices.items() if r.endswith('iOS-18-5') for d in ds if d['isAvailable'] and d['name']=='iPhone 16 Pro']
          if len(candidates)!=1:
              raise SystemExit('Required iOS 18.5 iPhone 16 Pro unavailable; configure runner, do not substitute')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('SIMULATOR_UDID='+candidates[0]['udid']+'\n')
          PY
      - name: Run the app and UI test plan (host stages run in the package job)
        run: Scripts/test-pr.sh
      - name: Retain results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-evidence
          path: Artifacts/
          if-no-files-found: error
